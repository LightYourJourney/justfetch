name: Release
# Builds the five platform archives and attaches them to a GitHub release.
#
# Two triggers on purpose: `workflow_dispatch` builds and uploads the archives
# without touching releases, so the five builds can be exercised before a tag
# exists. Only a tag push reaches the `release` job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build job only needs to read; the release job asks for write on its own.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          # Cross-compiled: the Intel macOS runners are the paid -intel/-large
          # images, and this is verified to produce a working x86_64 binary.
          # `native: false` skips the run step below, because running it would
          # need Rosetta on the runner; the archive is built, not executed.
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Add the build target
        run: rustup target add --toolchain stable ${{ matrix.target }}
      - name: Build
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Stage the archive contents
        shell: bash
        run: |
          set -eu
          name="justfetch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "stage/$name"
          if [ -f "target/${{ matrix.target }}/release/justfetch.exe" ]; then
            cp "target/${{ matrix.target }}/release/justfetch.exe" "stage/$name/justfetch.exe"
          else
            cp "target/${{ matrix.target }}/release/justfetch" "stage/$name/justfetch"
          fi
          cp LICENSE README.md "stage/$name/"
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "$NAME.tar.gz" -C stage "$NAME"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Archive the contents, not the directory: Scoop expects the binary at the
        # archive root, while the tar keeps its top-level directory.
        run: Compress-Archive -Path "stage/$env:NAME/*" -DestinationPath "$env:NAME.zip"
      # A successful cross-compile says nothing about whether the archive runs,
      # and running the build output would not prove the archive is usable. This
      # unpacks the archive it just produced and runs the binary from inside it,
      # for every target that can run on its own runner. The one that cannot is
      # marked `native: false` rather than left implied to have been tested.
      - name: Run the packaged binary (unix)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          mkdir -p artifact
          tar -xzf ./*.tar.gz -C artifact
          binary=$(find artifact -type f -name justfetch | head -1)
          run="${RUNNER_TEMP}/justfetch-run.json"
          "$binary" --format json > "$run"
          grep -A1 '"os": {' "$run" | grep -q '"status": "available"'
          grep -A1 '"memory": {' "$run" | grep -q '"status": "available"'
      - name: Run the packaged binary (windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem *.zip)[0].FullName -DestinationPath artifact
          $binary = Get-ChildItem artifact -Recurse -Filter justfetch.exe | Select-Object -First 1
          $run = Join-Path $env:RUNNER_TEMP 'justfetch-run.json'
          & $binary.FullName --format json > $run
          if ($LASTEXITCODE -ne 0) { throw "packaged justfetch exited $LASTEXITCODE" }
          $json = Get-Content $run -Raw
          foreach ($field in 'os', 'memory') {
            if (-not ($json -match ('"' + $field + '": \{\s*"status": "available"'))) {
              throw "$field is not available in the packaged binary"
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish the release
    needs: build
    # Only a tag push publishes. A manual dispatch of this workflow builds the
    # archives and stops; it cannot reach this job even if it is dispatched
    # against a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the crate version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Write checksums
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          # A checksum file that silently covers four of five archives is worse
          # than none, so the count is checked rather than assumed.
          listed=$(wc -l < SHA256SUMS)
          archives=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$listed" -ne "$archives" ]; then
            echo "SHA256SUMS lists $listed files but $archives archives exist"
            exit 1
          fi
      # --draft is the gate: the workflow assembles and verifies, and a
      # maintainer publishes. --prerelease stays until the real-hardware
      # verification in docs/roadmap.md is done; removing both words is the
      # change that turns a candidate into a release.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "justfetch ${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" \
            --draft --prerelease \
            dist/*
