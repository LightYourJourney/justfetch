name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository, and every third-party
# action is pinned to a commit SHA so a retagged release cannot change what runs.
permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --release --locked
      # The semantic assertions live in tests/detection.rs and run in the Test
      # step above. This proves the release-profile binary itself runs and still
      # emits the documented document, which `cargo run` would not distinguish.
      - name: Release binary emits a valid document
        shell: bash
        run: |
          set -eu
          binary="target/release/justfetch"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --format json > smoke.json
          grep -q '"schema_version": 1' smoke.json
          # Named fields, not "some field is available": a detector that fails
          # outright would otherwise leave this step green.
          grep -A1 '"os": {' smoke.json | grep -q '"status": "available"'
          grep -A1 '"memory": {' smoke.json | grep -q '"status": "available"'

  msrv:
    name: MSRV / 1.95.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --locked --all-targets

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal
      # Builds the crate from exactly the files the published package would
      # contain, so a missing entry in `include` fails here rather than at
      # publish time.
      - run: cargo +stable package --locked

  schema:
    name: JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --release --locked
      # An independent validator, not the hand-written one in the test suite:
      # if the two ever disagree, the schema or the document is wrong.
      - name: The comparison scripts behave
        run: python3 scripts/test_compare.py
      - name: Validate real documents
        run: |
          set -eu
          # Outside the workspace: these documents carry the runner's user and
          # host name, and a stray `git add -A` once committed them.
          full="${RUNNER_TEMP}/justfetch-full.json"
          partial="${RUNNER_TEMP}/justfetch-partial.json"
          ./target/release/justfetch --format json > "$full"
          ./target/release/justfetch --format json --modules os > "$partial"
          pipx run check-jsonschema==0.39.0 --schemafile docs/json-schema.json "$full" "$partial"
      - name: A broken document must be rejected
        run: |
          set -eu
          partial="${RUNNER_TEMP}/justfetch-partial.json"
          broken="${RUNNER_TEMP}/justfetch-broken.json"
          ./target/release/justfetch --format json --modules os > "$partial"
          python3 - "$partial" "$broken" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          # Only the state is wrong: every other key stays, so the document can
          # fail on nothing but the enum.
          assert doc["host"]["status"] == "deselected"
          doc["host"]["status"] = "maybe"
          json.dump(doc, open(sys.argv[2], "w"))
          PY
          output=$(pipx run check-jsonschema==0.39.0 --schemafile docs/json-schema.json "$broken" 2>&1) && {
            echo "the validator accepted a document with an unknown state"
            exit 1
          }
          # A missing tool or unreadable schema also exits non-zero; only a real
          # validation failure is the result this step is asserting.
          echo "$output" | grep -q "Schema validation errors were encountered" || {
            echo "the check failed for the wrong reason:"
            echo "$output"
            exit 1
          }
