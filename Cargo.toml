[package]
name = "justfetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Just fetch your system. Beautifully."
license = "GPL-3.0-only"
repository = "https://github.com/LightYourJourney/justfetch"
readme = "README.md"
keywords = ["system", "fetch", "cli", "terminal"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "assets/**", "docs/**", ".github/workflows/ci.yml", ".github/workflows/release.yml", "README.md", "AGENTS.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
anstyle = "1.0.14"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
